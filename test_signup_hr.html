<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <title>Registracija (replika za test)</title>
  <style>
    body { font-family: sans-serif; max-width: 460px; margin: 2rem auto; }
    .row { display: flex; gap: .5rem; margin-bottom: .8rem; }
    .field { position: relative; flex: 1; }
    .field input, .field select { width: 100%; padding: .6rem; box-sizing: border-box; }
    .float { position: absolute; left: .6rem; top: -.5rem; font-size: .75rem; background: #fff; }
    .gender label { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>Otvori račun</h1>
  <!-- Visible texts are Croatian and glued together without spaces,
       but the HTML (name / id / class) uses English identifiers. -->
  <form id="form">
    <div class="row">
      <div class="field _fn">
        <span class="float"><span>Ime</span><span>Ime</span></span>
        <input type="text" name="firstname" class="inputtext css-1x2y3z4a" aria-label="Ime">
      </div>
      <div class="field _ln">
        <span class="float">Prezime</span>
        <input type="text" name="lastname" class="inputtext css-9f8e7d6c" aria-label="Prezime">
      </div>
    </div>

    <div class="field-title">Datum rođenja</div>
    <div class="row">
      <select name="birthday_day" id="day" aria-label="Odaberite dan">
        <option value="0">Dan</option>
      </select>
      <select name="birthday_month" id="month" aria-label="Odaberite mjesec">
        <option value="0">Mjesec</option>
      </select>
      <select name="birthday_year" id="year" aria-label="Odaberite godinu">
        <option value="0">Godina</option>
      </select>
    </div>

    <div class="gender">
      <span>Spol</span>
      <span class="_5k_2"><label>Žensko<input type="radio" name="sex" value="1"></label></span>
      <span class="_5k_2"><label>Muško<input type="radio" name="sex" value="2"></label></span>
    </div>

    <div class="field"><span class="float">Broj mobitela ili adresa e-pošte</span>
      <input type="text" name="reg_email__" class="inputtext" data-testid="royal_email"></div>
    <br>
    <div class="field"><span class="float">Lozinka</span>
      <input type="password" name="reg_passwd__" class="inputtext" data-testid="royal_pass"></div>
    <br>
    <button type="submit" name="websubmit">Registriraj se</button>
  </form>
  <div id="result" class="success" style="display:none"></div>
  <script>
    const days = document.getElementById('day'), months = document.getElementById('month'),
          years = document.getElementById('year');
    for (let d = 1; d <= 31; d++) days.add(new Option(d, d));
    ['sij', 'velj', 'ožu', 'tra', 'svi', 'lip', 'srp', 'kol', 'ruj', 'lis', 'stu', 'pro']
      .forEach((m, i) => months.add(new Option(m, i + 1)));
    for (let y = 2026; y >= 1905; y--) years.add(new Option(y, y));
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const r = document.getElementById('result');
      r.style.display = 'block';
      r.textContent = 'Submitted: ' + JSON.stringify(Object.fromEntries(new FormData(e.target)));
    });
  </script>
</body>
</html>
