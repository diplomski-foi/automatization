<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom dropdown + custom next button</title>
  <style>
    body{font-family:sans-serif;max-width:480px;margin:2rem auto}
    label{display:block;margin-bottom:.8rem}
    input,textarea{display:block;width:100%;padding:.4rem}
    .dd{position:relative;border:1px solid #888;padding:.5rem;cursor:pointer;margin-bottom:.8rem}
    .dd ul{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #888;margin:0;padding:0;list-style:none;z-index:5}
    .dd li{padding:.5rem}.dd li:hover{background:#eee}
  </style>
</head>
<body>
  <h1>Custom components</h1>
  <form id="form">
    <div class="step">
      <label>First name <input type="text" name="first_name"></label>
      <span id="country-label">Country</span>
      <div class="dd" id="dd" role="combobox" aria-haspopup="listbox" aria-labelledby="country-label" tabindex="0">
        <span id="dd-value">-- choose --</span>
        <ul role="listbox" hidden>
          <li role="option">Croatia</li>
          <li role="option">Germany</li>
          <li role="option">Italy</li>
        </ul>
      </div>
      <div role="button" tabindex="0" id="go" style="display:inline-block;padding:.5rem 1rem;background:#ddd;cursor:pointer">Let's go</div>
    </div>
    <div class="step" hidden>
      <label>Message <textarea name="message"></textarea></label>
      <button type="submit">Submit</button>
    </div>
  </form>
  <div id="result" class="success" style="display:none"></div>
  <script>
    const dd = document.getElementById('dd'), list = dd.querySelector('ul');
    dd.addEventListener('click', e => {
      if (e.target.matches('li')) {
        document.getElementById('dd-value').textContent = e.target.textContent;
        dd.dataset.value = e.target.textContent;
        list.hidden = true;
      } else list.hidden = !list.hidden;
    });
    const steps = [...document.querySelectorAll('.step')];
    document.getElementById('go').onclick = () => { steps[0].hidden = true; steps[1].hidden = false; };
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const r = document.getElementById('result');
      r.style.display = 'block';
      r.textContent = 'Submitted: ' + JSON.stringify({...Object.fromEntries(new FormData(e.target)), country: dd.dataset.value});
    });
  </script>
</body>
</html>
